# Provider-free and read-only; never consume live provider credentials.
# Runs the integration-owned golden-byte fixture; NOT proof of live Node/C# interoperability.
name: Autopilot v2 offline signing contract

on:
  pull_request:
    paths:
      - "scripts/verify-autopilot-v2-contract-vectors.py"
      - "scripts/verify-autopilot-v2-node-contract.mjs"
      - "scripts/AutopilotV2Contracts/**"
      - ".github/workflows/autopilot-v2-offline-contract.yml"
  push:
    branches: [main]
    paths:
      - "scripts/verify-autopilot-v2-contract-vectors.py"
      - "scripts/verify-autopilot-v2-node-contract.mjs"
      - "scripts/AutopilotV2Contracts/**"
      - ".github/workflows/autopilot-v2-offline-contract.yml"

permissions:
  contents: read

jobs:
  offline-v2:
    name: Offline golden bytes (no providers)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONOPTIMIZE: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify deterministic v2 envelope and rejection tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-autopilot-v2-contract-vectors.py
          python3 scripts/verify-autopilot-v2-contract-vectors.py --emit-json > "$RUNNER_TEMP/autopilot-v2-vectors.json"
          python3 - "$RUNNER_TEMP/autopilot-v2-vectors.json" <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import pathlib
          import sys

          fixture = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert fixture["schema"] == "taslim.autopilot.signed-completion-v2.vectors.v1"
          vectors = fixture["vectors"]
          assert len(vectors) == 12
          assert len({v["name"] for v in vectors}) == 12
          key = fixture["syntheticSecretUtf8"].encode("utf-8")
          assert len(key) >= 32
          for vector in vectors:
              body = base64.b64decode(vector["bodyBase64"], validate=True)
              frame = base64.b64decode(vector["signedFrameBase64"], validate=True)
              assert 1 <= len(body) <= 65536
              actual_mac = "sha256=" + hmac.new(key, frame, hashlib.sha256).hexdigest()
              assert hmac.compare_digest(actual_mac, vector["expectedSignature"]), vector["name"]
          print("PASS: 12 offline vector exports and expected signatures")
          PY
      - name: Independently reconstruct and verify 12 vectors in Node.js
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node scripts/verify-autopilot-v2-node-contract.mjs "$RUNNER_TEMP/autopilot-v2-vectors.json"
      - name: Set up .NET 8 (synthetic HMAC contract only)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - name: Independently reconstruct and verify 12 vectors in C#/.NET 8
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --configuration Release --project scripts/AutopilotV2Contracts/AutopilotV2Contracts.csproj -- "$RUNNER_TEMP/autopilot-v2-vectors.json"
