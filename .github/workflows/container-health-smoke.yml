name: Production container smoke

on:
  push:
    branches: [main, "parallel/**"]
  pull_request:

permissions:
  contents: read

jobs:
  container-health:
    name: Build production images and smoke-test API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15@sha256:e27d24a29acce1b554771ba68c43afa55446069d228310451bb8c96c1531d2cb
        env:
          POSTGRES_USER: taslim
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: taslim_container_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taslim -d taslim_container_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate smoke helpers
        run: |
          bash -n scripts/container-health-smoke.sh
          bash scripts/container-health-smoke.test.sh

      - name: Build API production image
        run: docker build --file apps/api/Dockerfile --tag taslim-api:release-smoke apps/api

      - name: Build web production image
        run: >-
          docker build
          --file apps/web/Dockerfile
          --build-arg NEXT_PUBLIC_API_URL=https://api.example.test
          --tag taslim-web:release-smoke
          apps/web

      - name: Smoke-test API container liveness and readiness
        env:
          SMOKE_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=taslim_container_smoke;Username=taslim;Password=change-me
        run: bash scripts/container-health-smoke.sh taslim-api:release-smoke 8080 120
