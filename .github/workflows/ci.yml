name: Taslim CI

on:
  push:
    branches: [main, "parallel/**", "feature/taslim-autopilot-next-wave"]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  DOTNET_VERSION: "8.0.x"

jobs:
  smoke-contracts:
    name: Deployment smoke helper contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate API health smoke helper
        run: |
          bash -n scripts/api-health-smoke.sh scripts/api-health-smoke.test.sh
          bash scripts/api-health-smoke.test.sh

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test --workspace @taslim/web
      - run: npm run lint --workspace @taslim/web
      - run: npx tsc --noEmit -p apps/web/tsconfig.json
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.example.test
        run: npm run build --workspace @taslim/web

  api:
    name: API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15@sha256:e27d24a29acce1b554771ba68c43afa55446069d228310451bb8c96c1531d2cb # postgres:15 linux/amd64
        env:
          POSTGRES_USER: taslim
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: taslim_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taslim -d taslim_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Hosted Movie media release qualification
      # (MovieFinalAssemblyHostedFfmpegGateTests) shells out to the real
      # /usr/bin/ffmpeg and /usr/bin/ffprobe and drives the mixed silent/sounded,
      # landscape/portrait assembly and caption burn-in fixture. GitHub-hosted
      # ubuntu-latest images ship neither, so 'API integration tests' fails closed
      # on #298 / #807 / #1138. FFmpeg is installed from the Ubuntu archive and
      # hard-verified before the suite runs. The gate itself is untouched: it still
      # fails closed, and nothing here skips, mocks, disables or short-circuits it.
      - name: Install and verify real FFmpeg for hosted media qualification
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          test -x /usr/bin/ffmpeg || { echo "::error::/usr/bin/ffmpeg missing after install" >&2; exit 1; }
          test -x /usr/bin/ffprobe || { echo "::error::/usr/bin/ffprobe missing after install" >&2; exit 1; }
          # Every assertion below reads a captured variable instead of a live pipe:
          # measured in development, `ffprobe ... | grep -q` turned a passing probe into
          # a false failure because grep exits at the first match and the writer then
          # dies of SIGPIPE under `set -o pipefail`.
          ffmpeg_version="$(/usr/bin/ffmpeg -hide_banner -version)"
          ffprobe_version="$(/usr/bin/ffprobe -hide_banner -version)"
          echo "${ffmpeg_version%%$'\n'*}"
          echo "${ffprobe_version%%$'\n'*}"
          # Capture first: grep -q closing the pipe early would make ffmpeg exit
          # with SIGPIPE under `set -o pipefail` and fail this step spuriously.
          encoders="$(/usr/bin/ffmpeg -hide_banner -encoders)"
          grep -Eq ' (mpeg4|aac) ' <<<"$encoders" || { echo "::error::mpeg4/aac encoders unavailable" >&2; exit 1; }
          tmp="$(mktemp -d)"
          /usr/bin/ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=red:s=320x180:r=10" \
            -f lavfi -i "sine=frequency=880:sample_rate=48000" \
            -t 0.2 -c:v mpeg4 -c:a aac "$tmp/mixed.mp4"
          probe="$(/usr/bin/ffprobe -v error -show_entries stream=codec_type:format=duration -of json "$tmp/mixed.mp4")"
          grep -q '"codec_type": "audio"' <<<"$probe" || { echo "::error::ffprobe did not report an audio stream" >&2; exit 1; }
          grep -q '"codec_type": "video"' <<<"$probe" || { echo "::error::ffprobe did not report a video stream" >&2; exit 1; }
          rm -rf "$tmp"
          echo "Real mixed audio/video assembly + ffprobe toolchain verified for hosted media qualification."

      - name: Audit production NuGet dependencies
        shell: bash
        run: |
          report="$(dotnet list apps/api/Taslim.Api.csproj package --vulnerable --include-transitive)"
          printf '%s\n' "$report"
          if grep -q "has the following vulnerable packages" <<<"$report"; then
            echo "Production NuGet vulnerability detected." >&2
            exit 1
          fi
      - run: dotnet test apps/api.Tests/Taslim.Api.Tests.csproj
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=taslim_tests;Username=taslim;Password=change-me
          Database__ApplyMigrations: "false"

      # Named, explicit pass over the same qualification gate so the release lane reads
      # the media proof from its own step on the exact head. Measured behaviour: a filter
      # matching zero tests still exits 0, so "the gate exists and executed" is taken from
      # the summary line rather than trusted from the exit code.
      - name: Run hosted media release qualification gate explicitly
        run: |
          set -euo pipefail
          # `dotnet test` exits 0 even when a filter matches nothing, so the named
          # proof is asserted against its summary line rather than its exit code:
          # zero matches, or any failure, fails this step closed. Output is captured
          # first because grep -q closing the pipe early trips `set -o pipefail`.
          out="$(dotnet test apps/api.Tests/Taslim.Api.Tests.csproj --no-build \
                --filter "FullyQualifiedName=Taslim.Api.Tests.MovieFinalAssemblyHostedFfmpegGateTests.Hosted_ci_executes_real_mixed_audio_video_assembly_and_probes_output" 2>&1)"
          printf '%s\n' "$out"
          if grep -Eiq 'No test (matches|that matches)' <<<"$out"; then
            echo "::error::hosted media qualification gate was not found; refusing to report green" >&2
            exit 1
          fi
          grep -Eq 'Passed:[[:space:]]+1,[[:space:]]+Skipped:[[:space:]]+0,[[:space:]]+Total:[[:space:]]+1' <<<"$out" || {
            echo "::error::hosted media qualification gate did not run exactly one executed test" >&2
            exit 1
          }

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [frontend]
    services:
      postgres:
        image: postgres:15@sha256:e27d24a29acce1b554771ba68c43afa55446069d228310451bb8c96c1531d2cb # postgres:15 linux/amd64
        env:
          POSTGRES_USER: taslim
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: taslim_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taslim -d taslim_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Compile outside the health window: on current main the API needs
      # >116s before it first serves /health/live when `dotnet run` builds
      # in-line and the EF migration chain (~80 migrations) runs before
      # Kestrel binds, which races the smoke helper's default 60x2s budget.
      # Browser E2E failed both attempts of run 44220770861 (PR #1022) with
      # "connection refused" after 120s while passing heads exhausted
      # attempts 40 and 58 of 60.
      - name: Build API before the health window
        run: dotnet build apps/api/Taslim.Api.csproj --nologo -v q
      - name: Start API
        env:
          # Widen the wait budget (120 x 2s = 240s) so a slow-but-healthy
          # cold start cannot exhaust the probe window; still fails fast if
          # the API crashes on boot because the log capture surfaces it.
          SMOKE_MAX_ATTEMPTS: "120"
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=taslim_e2e;Username=taslim;Password=change-me
          Database__ApplyMigrations: "true"
          AllowedOrigins__0: http://localhost:3000
          Ai__OpenAI__Enabled: "false"
          Files__StorageProvider: Local
          Files__LocalRootPath: ${{ github.workspace }}/.e2e-files
        run: |
          mkdir -p .e2e-files
          nohup dotnet run --project apps/api --urls http://127.0.0.1:5000 > /tmp/taslim-api.log 2>&1 &
          bash scripts/api-health-smoke.sh http://127.0.0.1:5000
      - name: Run browser tests
        env:
          E2E_API_URL: http://localhost:5000
          NEXT_PUBLIC_API_URL: http://localhost:5000
          E2E_TEST_PASSWORD: E2eStrongPassword!123
          CI: "true"
        run: npm run test:e2e --workspace @taslim/web
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/taslim-api.log
          if-no-files-found: ignore

  autopilot-gate:
    name: Autopilot next-wave gate
    # This gate is specific to main/next-wave integration. Keep ordinary CI
    # required for other PRs, but do not make the next-wave policy reject
    # legitimate chained PRs whose base is another dependency branch.
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/taslim-autopilot-next-wave' || (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'feature/taslim-autopilot-next-wave')) }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15@sha256:e27d24a29acce1b554771ba68c43afa55446069d228310451bb8c96c1531d2cb # postgres:15 linux/amd64
        env:
          POSTGRES_USER: taslim
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: taslim_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taslim -d taslim_fresh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet tool restore
      - run: dotnet restore apps/api.Tests/Taslim.Api.Tests.csproj
      - name: Verify next-wave gate ref resolution
        run: bash scripts/next-wave-refs.test.sh
      - name: Run the bounded next-wave launch gate
        env:
          RUN_DB_MIGRATIONS: "1"
          FRESH_DATABASE_URL: Host=localhost;Port=5432;Database=taslim_fresh;Username=taslim;Password=change-me
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=taslim_fresh;Username=taslim;Password=change-me
          Database__ApplyMigrations: "false"
        run: bash scripts/autopilot-next-wave-gate.sh
