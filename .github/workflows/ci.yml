name: Taslim CI

on:
  push:
    branches: [main, "parallel/**", "feature/taslim-autopilot-next-wave"]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  DOTNET_VERSION: "8.0.x"

jobs:
  smoke-contracts:
    name: Deployment smoke helper contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate API health smoke helper
        run: |
          bash -n scripts/api-health-smoke.sh scripts/api-health-smoke.test.sh
          bash scripts/api-health-smoke.test.sh

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test --workspace @taslim/web
      - run: npm run lint --workspace @taslim/web
      - run: npx tsc --noEmit -p apps/web/tsconfig.json
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.example.test
        run: npm run build --workspace @taslim/web

  api:
    name: API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15@sha256:e27d24a29acce1b554771ba68c43afa55446069d228310451bb8c96c1531d2cb # postgres:15 linux/amd64
        env:
          POSTGRES_USER: taslim
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: taslim_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taslim -d taslim_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Audit production NuGet dependencies
        shell: bash
        run: |
          report="$(dotnet list apps/api/Taslim.Api.csproj package --vulnerable --include-transitive)"
          printf '%s\n' "$report"
          if grep -q "has the following vulnerable packages" <<<"$report"; then
            echo "Production NuGet vulnerability detected." >&2
            exit 1
          fi
      - run: dotnet test apps/api.Tests/Taslim.Api.Tests.csproj
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=taslim_tests;Username=taslim;Password=change-me
          Database__ApplyMigrations: "false"

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [frontend]
    services:
      postgres:
        image: postgres:15@sha256:e27d24a29acce1b554771ba68c43afa55446069d228310451bb8c96c1531d2cb # postgres:15 linux/amd64
        env:
          POSTGRES_USER: taslim
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: taslim_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taslim -d taslim_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Build API before startup smoke
        run: dotnet build apps/api/Taslim.Api.csproj
      - name: Start API
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=taslim_e2e;Username=taslim;Password=change-me
          Database__ApplyMigrations: "true"
          AllowedOrigins__0: http://localhost:3000
          Ai__OpenAI__Enabled: "false"
          Files__StorageProvider: Local
          Files__LocalRootPath: ${{ github.workspace }}/.e2e-files
        run: |
          mkdir -p .e2e-files
          nohup dotnet run --no-build --project apps/api --urls http://127.0.0.1:5000 > /tmp/taslim-api.log 2>&1 &
          bash scripts/api-health-smoke.sh http://127.0.0.1:5000
      - name: Run browser tests
        env:
          E2E_API_URL: http://localhost:5000
          NEXT_PUBLIC_API_URL: http://localhost:5000
          E2E_TEST_PASSWORD: E2eStrongPassword!123
          CI: "true"
        run: npm run test:e2e --workspace @taslim/web
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/taslim-api.log
          if-no-files-found: ignore

  autopilot-gate:
    name: Autopilot next-wave gate
    # This gate is specific to main/next-wave integration. Keep ordinary CI
    # required for other PRs, but do not make the next-wave policy reject
    # legitimate chained PRs whose base is another dependency branch.
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/taslim-autopilot-next-wave' || (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'feature/taslim-autopilot-next-wave')) }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15@sha256:e27d24a29acce1b554771ba68c43afa55446069d228310451bb8c96c1531d2cb # postgres:15 linux/amd64
        env:
          POSTGRES_USER: taslim
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: taslim_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taslim -d taslim_fresh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet tool restore
      - run: dotnet restore apps/api.Tests/Taslim.Api.Tests.csproj
      - name: Verify next-wave gate ref resolution
        run: bash scripts/next-wave-refs.test.sh
      - name: Run the bounded next-wave launch gate
        env:
          RUN_DB_MIGRATIONS: "1"
          FRESH_DATABASE_URL: Host=localhost;Port=5432;Database=taslim_fresh;Username=taslim;Password=change-me
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=taslim_fresh;Username=taslim;Password=change-me
          Database__ApplyMigrations: "false"
        run: bash scripts/autopilot-next-wave-gate.sh
